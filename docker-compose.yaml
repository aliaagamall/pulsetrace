name: pulsetrace

x-common-environment: &common-environment
  NODE_ENV: ${NODE_ENV:?NODE_ENV must be set}

x-common-service: &common-service
  init: true
  restart: unless-stopped
  stop_grace_period: 10s
  networks:
    - pulsetrace-network
  healthcheck:
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 5s

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pulsetrace_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: postgres
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD must be set}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init/001_create_databases.sh:/docker-entrypoint-initdb.d/001_create_databases.sh:ro
    networks:
      - pulsetrace-network
    healthcheck:
      test:
        - CMD-SHELL
        - >
          pg_isready -U pulsetrace_admin -d postgres &&
          psql -U pulsetrace_admin -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='order_db'" | grep -q 1 &&
          psql -U pulsetrace_admin -d postgres -tAc "SELECT 1 FROM pg_database WHERE datname='payment_db'" | grep -q 1
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  api-gateway:
    <<: *common-service
    image: pulsetrace-api-gateway:0.1.0
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      <<: *common-environment
      PORT: 3000
      ORDER_SERVICE_URL: http://order-service:3001
    depends_on:
      order-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"

  order-service:
    <<: *common-service
    image: pulsetrace-order-service:0.1.0
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      <<: *common-environment
      PORT: 3001
      PAYMENT_SERVICE_URL: http://payment-service:3002
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: order_db
      PGUSER: order_service
      PGPASSWORD: ${ORDER_DB_PASSWORD:?ORDER_DB_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy
      payment-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"

  payment-service:
    <<: *common-service
    image: pulsetrace-payment-service:0.1.0
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    environment:
      <<: *common-environment
      PORT: 3002
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: payment_db
      PGUSER: payment_service
      PGPASSWORD: ${PAYMENT_DB_PASSWORD:?PAYMENT_DB_PASSWORD must be set}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"

volumes:
  postgres-data:

networks:
  pulsetrace-network:
    driver: bridge