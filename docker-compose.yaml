name: pulsetrace

x-common-environment: &common-environment
  NODE_ENV: ${NODE_ENV:?NODE_ENV must be set}

x-common-service: &common-service
  init: true
  restart: unless-stopped
  stop_grace_period: 10s
  networks:
    - pulsetrace-network
  healthcheck:
    interval: 10s
    timeout: 3s
    retries: 5
    start_period: 5s

services:
  api-gateway:
    <<: *common-service
    image: pulsetrace-api-gateway:0.1.0
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "3000:3000"
    environment:
      <<: *common-environment
      PORT: 3000
      ORDER_SERVICE_URL: http://order-service:3001
    depends_on:
      order-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"

  order-service:
    <<: *common-service
    image: pulsetrace-order-service:0.1.0
    build:
      context: .
      dockerfile: services/order-service/Dockerfile
    environment:
      <<: *common-environment
      PORT: 3001
      PAYMENT_SERVICE_URL: http://payment-service:3002
    depends_on:
      payment-service:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"

  payment-service:
    <<: *common-service
    image: pulsetrace-payment-service:0.1.0
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    environment:
      <<: *common-environment
      PORT: 3002
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"

networks:
  pulsetrace-network:
    driver: bridge